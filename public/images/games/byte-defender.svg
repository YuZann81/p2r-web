<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bd-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#080512" />
      <stop offset="60%" stop-color="#1A1230" />
      <stop offset="100%" stop-color="#321654" />
    </linearGradient>
    <radialGradient id="shield-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#68D5E8" stop-opacity="0.8" />
      <stop offset="60%" stop-color="#9470E8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0E0A1A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bd-bg)" />

  <!-- Digital Circuit Matrix -->
  <g stroke="#9470E8" stroke-width="1.2" opacity="0.35">
    <path d="M 40 40 H 120 V 100 H 200" fill="none" />
    <circle cx="200" cy="100" r="4" fill="#68D5E8" />
    <path d="M 600 40 H 520 V 120 H 460" fill="none" />
    <circle cx="460" cy="120" r="4" fill="#FFD447" />
    <path d="M 60 320 H 160 V 260 H 220" fill="none" />
    <circle cx="220" cy="260" r="4" fill="#F276A5" />
    <path d="M 580 320 H 480 V 250 H 420" fill="none" />
    <circle cx="420" cy="250" r="4" fill="#68D5E8" />
  </g>

  <!-- Central Core Shield Glow -->
  <circle cx="320" cy="180" r="110" fill="url(#shield-glow)" />

  <!-- Core Server Diamond Shield -->
  <polygon points="320,105 385,180 320,255 255,180" fill="#211B35" stroke="#68D5E8" stroke-width="4" />
  <polygon points="320,125 365,180 320,235 275,180" fill="#39265E" stroke="#FFD447" stroke-width="2" />
  
  <!-- Server Pixel Glyph Inside Core -->
  <rect x="302" y="160" width="36" height="8" rx="2" fill="#68D5E8" />
  <rect x="302" y="174" width="36" height="8" rx="2" fill="#FFD447" />
  <rect x="302" y="188" width="36" height="8" rx="2" fill="#F276A5" />
  <!-- Core indicator lights -->
  <circle cx="308" cy="164" r="2" fill="#FFF5E9" />
  <circle cx="308" cy="178" r="2" fill="#FFF5E9" />
  <circle cx="308" cy="192" r="2" fill="#FFF5E9" />

  <!-- Laser Defense Beams -->
  <line x1="255" y1="180" x2="80" y2="120" stroke="#FFD447" stroke-width="3" stroke-dasharray="8,6" opacity="0.9" />
  <line x1="385" y1="180" x2="560" y2="130" stroke="#68D5E8" stroke-width="3" stroke-dasharray="8,6" opacity="0.9" />

  <!-- Invader Bug Enemies -->
  <g transform="translate(70, 110)">
    <rect x="0" y="0" width="16" height="12" fill="#F276A5" />
    <rect x="-4" y="4" width="24" height="4" fill="#F276A5" />
    <rect x="3" y="3" width="3" height="3" fill="#FFF5E9" />
    <rect x="10" y="3" width="3" height="3" fill="#FFF5E9" />
  </g>
  <g transform="translate(550, 120)">
    <rect x="0" y="0" width="16" height="12" fill="#F276A5" />
    <rect x="-4" y="4" width="24" height="4" fill="#F276A5" />
    <rect x="3" y="3" width="3" height="3" fill="#FFF5E9" />
    <rect x="10" y="3" width="3" height="3" fill="#FFF5E9" />
  </g>

  <!-- Title Badge Overlay -->
  <rect x="210" y="24" width="220" height="36" rx="10" fill="#0E0A1A" stroke="#68D5E8" stroke-width="2" />
  <text x="320" y="48" fill="#68D5E8" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">BYTE DEFENDER</text>
</svg>
