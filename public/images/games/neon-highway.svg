<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="nh-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0A1A" />
      <stop offset="60%" stop-color="#2D114D" />
      <stop offset="100%" stop-color="#F276A5" />
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#211B35" />
      <stop offset="100%" stop-color="#080512" />
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="640" height="210" fill="url(#nh-sky)" />

  <!-- Distant City Skyline -->
  <polygon points="120,210 120,150 145,150 145,170 170,170 170,140 195,140 195,210" fill="#171026" />
  <polygon points="440,210 440,145 470,145 470,165 490,165 490,135 520,135 520,210" fill="#171026" />
  <!-- City window pixels -->
  <rect x="125" y="155" width="2" height="3" fill="#FFD447" />
  <rect x="135" y="165" width="2" height="3" fill="#68D5E8" />
  <rect x="175" y="148" width="2" height="3" fill="#FFF5E9" />
  <rect x="448" y="152" width="2" height="3" fill="#FFD447" />
  <rect x="500" y="142" width="2" height="3" fill="#68D5E8" />

  <!-- Road Horizon -->
  <rect y="210" width="640" height="150" fill="url(#road)" />

  <!-- Perspective Highway Strips -->
  <polygon points="320,210 320,210 160,360 480,360" fill="#140D24" />
  <!-- Highway Neon Edges -->
  <line x1="320" y1="210" x2="160" y2="360" stroke="#F276A5" stroke-width="4" />
  <line x1="320" y1="210" x2="480" y2="360" stroke="#F276A5" stroke-width="4" />
  <line x1="320" y1="210" x2="150" y2="360" stroke="#68D5E8" stroke-width="2" opacity="0.6" />
  <line x1="320" y1="210" x2="490" y2="360" stroke="#68D5E8" stroke-width="2" opacity="0.6" />

  <!-- Center Dashed Road Lines -->
  <line x1="320" y1="215" x2="320" y2="230" stroke="#FFD447" stroke-width="2" />
  <line x1="320" y1="240" x2="320" y2="265" stroke="#FFD447" stroke-width="3" />
  <line x1="320" y1="280" x2="320" y2="315" stroke="#FFD447" stroke-width="5" />
  <line x1="320" y1="335" x2="320" y2="360" stroke="#FFD447" stroke-width="7" />

  <!-- Retro Cyber Sports Car Rear -->
  <g transform="translate(320, 290)">
    <!-- Rear spoiler -->
    <rect x="-35" y="-12" width="70" height="4" fill="#F276A5" />
    <rect x="-25" y="-8" width="6" height="4" fill="#68D5E8" />
    <rect x="19" y="-8" width="6" height="4" fill="#68D5E8" />
    <!-- Car body -->
    <polygon points="-30,-4 30,-4 36,18 -36,18" fill="#39265E" stroke="#68D5E8" stroke-width="2" />
    <!-- Neon taillights -->
    <rect x="-28" y="2" width="56" height="4" rx="2" fill="#F276A5" />
    <!-- Twin exhaust glow -->
    <circle cx="-12" cy="18" r="4" fill="#68D5E8" />
    <circle cx="12" cy="18" r="4" fill="#68D5E8" />
  </g>

  <!-- Title Badge Overlay -->
  <rect x="220" y="24" width="200" height="36" rx="10" fill="#0E0A1A" stroke="#F276A5" stroke-width="2" />
  <text x="320" y="48" fill="#F276A5" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">NEON HIGHWAY</text>
</svg>
