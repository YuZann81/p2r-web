<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0E0A1A" />
      <stop offset="50%" stop-color="#211B35" />
      <stop offset="100%" stop-color="#39265E" />
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD447" />
      <stop offset="60%" stop-color="#F276A5" />
      <stop offset="100%" stop-color="#9470E8" />
    </linearGradient>
    <linearGradient id="grid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#68D5E8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0E0A1A" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="360" fill="url(#bg)" />

  <!-- Stars -->
  <circle cx="80" cy="50" r="1.5" fill="#FFF5E9" opacity="0.8" />
  <circle cx="160" cy="90" r="1" fill="#68D5E8" opacity="0.6" />
  <circle cx="240" cy="40" r="2" fill="#FFD447" opacity="0.7" />
  <circle cx="420" cy="60" r="1.5" fill="#FFF5E9" opacity="0.8" />
  <circle cx="530" cy="35" r="2" fill="#68D5E8" opacity="0.9" />
  <circle cx="580" cy="85" r="1" fill="#FFD447" opacity="0.7" />

  <!-- Neon Retro Sun -->
  <circle cx="320" cy="170" r="75" fill="url(#sun)" />
  <!-- Sun horizontal grill lines -->
  <rect x="240" y="150" width="160" height="3" fill="#211B35" />
  <rect x="240" y="160" width="160" height="4" fill="#211B35" />
  <rect x="240" y="172" width="160" height="6" fill="#211B35" />
  <rect x="240" y="186" width="160" height="8" fill="#211B35" />
  <rect x="240" y="202" width="160" height="12" fill="#211B35" />

  <!-- Perspective Cyber Grid Ground -->
  <path d="M 0 210 L 640 210 L 640 360 L 0 360 Z" fill="#120D22" />
  <line x1="0" y1="210" x2="640" y2="210" stroke="#68D5E8" stroke-width="2" />
  <!-- Grid Perspective Lines -->
  <line x1="320" y1="210" x2="320" y2="360" stroke="#68D5E8" stroke-width="2" opacity="0.8" />
  <line x1="320" y1="210" x2="220" y2="360" stroke="#68D5E8" stroke-width="1.5" opacity="0.7" />
  <line x1="320" y1="210" x2="100" y2="360" stroke="#68D5E8" stroke-width="1.5" opacity="0.6" />
  <line x1="320" y1="210" x2="-60" y2="360" stroke="#68D5E8" stroke-width="1.5" opacity="0.5" />
  <line x1="320" y1="210" x2="420" y2="360" stroke="#68D5E8" stroke-width="1.5" opacity="0.7" />
  <line x1="320" y1="210" x2="540" y2="360" stroke="#68D5E8" stroke-width="1.5" opacity="0.6" />
  <line x1="320" y1="210" x2="700" y2="360" stroke="#68D5E8" stroke-width="1.5" opacity="0.5" />

  <!-- Grid Horizontal Lines -->
  <line x1="0" y1="222" x2="640" y2="222" stroke="#68D5E8" stroke-width="1" opacity="0.4" />
  <line x1="0" y1="238" x2="640" y2="238" stroke="#68D5E8" stroke-width="1.2" opacity="0.5" />
  <line x1="0" y1="260" x2="640" y2="260" stroke="#68D5E8" stroke-width="1.5" opacity="0.6" />
  <line x1="0" y1="290" x2="640" y2="290" stroke="#68D5E8" stroke-width="1.8" opacity="0.7" />
  <line x1="0" y1="330" x2="640" y2="330" stroke="#68D5E8" stroke-width="2" opacity="0.8" />

  <!-- Cyber Runner Silhouette -->
  <g transform="translate(290, 195) scale(1.4)">
    <!-- Motion trails -->
    <rect x="-25" y="10" width="18" height="3" fill="#68D5E8" opacity="0.7" />
    <rect x="-18" y="16" width="12" height="3" fill="#FFD447" opacity="0.8" />
    <!-- Pixel runner body -->
    <rect x="0" y="0" width="8" height="8" fill="#FFD447" /> <!-- head -->
    <rect x="-2" y="8" width="12" height="14" fill="#68D5E8" /> <!-- torso -->
    <rect x="-6" y="12" width="6" height="5" fill="#FFD447" /> <!-- arm back -->
    <rect x="8" y="9" width="7" height="5" fill="#FFD447" /> <!-- arm front -->
    <rect x="-8" y="22" width="7" height="12" fill="#F276A5" /> <!-- leg back -->
    <rect x="5" y="22" width="7" height="10" fill="#F276A5" /> <!-- leg front -->
  </g>

  <!-- Title Badge Overlay -->
  <rect x="190" y="24" width="260" height="36" rx="10" fill="#0E0A1A" stroke="#FFD447" stroke-width="2" />
  <text x="320" y="48" fill="#FFD447" font-family="'Courier New', monospace" font-size="16" font-weight="bold" text-anchor="middle" letter-spacing="3">CYBER RUNNER 2099</text>
</svg>
