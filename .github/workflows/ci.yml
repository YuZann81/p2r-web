name: CI - p2r-web

# Pull requests only. A push to develop or main is validated by deploy.yml,
# whose ci job runs the same gates before deploying, so listing pushes here
# would run the whole pipeline twice for one commit.
on:
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: p2r-web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # No `version:` input on purpose. package.json's `packageManager` field
      # (pnpm@11.21.0+sha512...) is the single source of truth for the pnpm
      # version. Declaring the version here as well makes action-setup fail the
      # job with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          # Single source of truth, shared with deploy.yml and the staging
          # runtime installer.
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Linter (ESLint)
        run: pnpm lint

      - name: Run Test Suite (Jest)
        run: pnpm test

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time and
      # are therefore public. PRs targeting main exercise the approved production
      # origin; PRs targeting develop leave NEXT_PUBLIC_* unset because staging
      # has no public hostname yet (avoiding both production leakage and browser
      # loopback misrouting).
      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_P2R_API_BASE_URL: ${{ github.base_ref == 'main' && 'https://pameran.devsaka.id/api' || '' }}
          NEXT_PUBLIC_P2R_PANEL_URL: ${{ github.base_ref == 'main' && 'https://pameran.devsaka.id/panel' || '' }}
        run: pnpm build

      - name: Verify Standalone Runtime Artifact
        run: bash scripts/package-standalone.sh p2r-web

      - name: Verify Browser Bundle and Environment Isolation
        env:
          NEXT_PUBLIC_P2R_API_BASE_URL: ${{ github.base_ref == 'main' && 'https://pameran.devsaka.id/api' || '' }}
          NEXT_PUBLIC_P2R_PANEL_URL: ${{ github.base_ref == 'main' && 'https://pameran.devsaka.id/panel' || '' }}
        run: |
          set -euo pipefail
          if [ "${GITHUB_BASE_REF:-}" = "main" ]; then
            test -n "$NEXT_PUBLIC_P2R_API_BASE_URL"
            test -n "$NEXT_PUBLIC_P2R_PANEL_URL"
            grep -rqF "$NEXT_PUBLIC_P2R_API_BASE_URL" .next/standalone/.next/static
            if grep -rqF "127.0.0.1" .next/standalone/.next/static; then
              echo "::error::A loopback address was inlined into the production browser bundle."
              exit 1
            fi
          else
            if grep -rqF "pameran.devsaka.id" .next/standalone; then
              echo "::error::Production hostname pameran.devsaka.id leaked into the staging artifact."
              exit 1
            fi
            if grep -rqF "127.0.0.1" .next/standalone/.next/static; then
              echo "::error::A loopback address was inlined into the staging browser bundle."
              exit 1
            fi
          fi
