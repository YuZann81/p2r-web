name: CI - p2r-web

# Pull requests only. A push to develop or main is validated by deploy.yml,
# whose ci job runs the same gates before deploying, so listing pushes here
# would run the whole pipeline twice for one commit.
on:
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: p2r-web-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # No `version:` input on purpose. package.json's `packageManager` field
      # (pnpm@11.21.0+sha512...) is the single source of truth for the pnpm
      # version. Declaring the version here as well makes action-setup fail the
      # job with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          # Single source of truth, shared with deploy.yml and the staging
          # runtime installer.
          node-version-file: .node-version
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run TypeScript Typecheck
        run: pnpm typecheck

      - name: Run Linter (ESLint)
        run: pnpm lint

      - name: Run Test Suite (Jest)
        run: pnpm test

      # NEXT_PUBLIC_* values are inlined into the client bundle at build time and
      # are therefore public. This build must exercise the same production
      # values as deploy.yml so CI catches a broken public origin before a
      # release does. There is no loopback fallback: a browser cannot resolve
      # one, and the approved origin is the only public target.
      - name: Build Next.js Application
        env:
          NEXT_PUBLIC_P2R_API_BASE_URL: https://pameran.devsaka.id/api
          NEXT_PUBLIC_P2R_PANEL_URL: https://pameran.devsaka.id/panel
        run: pnpm build
