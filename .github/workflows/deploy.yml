name: CD - p2r-web (blocked)

# Automated CD is intentionally not implemented.
#
# Verified production runtime: Docker Compose project `p2r-production`, using
# `compose.yaml` + `compose.production.yaml` and host-local image builds from CI
# artifacts tagged with the full 40-character commit SHA.
#
# The historical `deploy-release.sh` path is PM2-era; production has no PM2
# application processes for these services. No Docker Compose activation
# command has been verified end-to-end. This workflow therefore refuses to
# contact any host and activates nothing.
#
# Use the P2R production release runbook
# (docs/Deployment/P2R-PRODUCTION-RELEASE-RUNBOOK.md in the P2R workspace) only
# under separate authorization.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: p2r-web-cd-blocked
  cancel-in-progress: false

jobs:
  blocked:
    name: Automated CD unavailable
    runs-on: ubuntu-latest
    timeout-minutes: 1

    steps:
      - name: Refuse unverified activation
        run: |
          echo "::error::Automated CD for p2r-web is blocked."
          echo "No production host was contacted and no release was activated."
          echo "The verified runtime is the p2r-production Compose project."
          echo "Use the P2R production release runbook under separate authorization:"
          echo "docs/Deployment/P2R-PRODUCTION-RELEASE-RUNBOOK.md (P2R workspace)."
          exit 1
